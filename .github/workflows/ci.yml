name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend - Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Backend - Run Tests
        working-directory: ./backend
        run: npm test

      - name: Frontend - Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend - Run Tests
        working-directory: ./frontend
        run: npm test

      - name: Frontend - Build
        working-directory: ./frontend
        run: npm run build

      - name: Docker Build
        run: docker build -t devopshub:${{ github.sha }} .
